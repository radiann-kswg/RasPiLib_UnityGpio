# /etc/unitygpio.conf — unitygpiod の設定。変更後は `sudo systemctl restart unitygpiod`
[unitygpio]
# OS やほかの基板が使うピン（BCM 番号、カンマ区切り）。ゲームからは確保できない。
reserved =

# Unix ソケットの場所（通常は変えない）
socket = /run/unitygpio/unitygpio.sock

# 遠隔モード（Unity Editor から TCP で接続）。既定で無効。
# ループバック以外で待ち受けるときは tcp_token が必須（無いと TCP を開かない）。
# 例: tcp_listen = 0.0.0.0:8787
tcp_listen =
tcp_token =

# PWM の pwmchip を自動検出できないときに指定（例: /sys/class/pwm/pwmchip2）
pwmchip =
